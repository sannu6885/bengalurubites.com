<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengaluru Bites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: #ff6b35;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .content {
            background: #f4f4f4;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🍲 Bengaluru Bites</h1>
        <p>Discover the flavors of Bangalore</p>
    </header>

    <div class="container">
        <div class="content">
            <h2>Welcome to Bengaluru Bites</h2>
            <p>Your ultimate guide to food, culture, and experiences in Bangalore.</p>
            <p>Explore local restaurants, street food, and culinary gems across the city.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Bengaluru Bites. All rights reserved.</p>
    </footer>
</body>
</html>
